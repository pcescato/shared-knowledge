# GitHub Pages deployment for the public knowledge base.
#
# Runs after changes land on the default branch - which by definition have
# passed human review (the MCP can only open Pull Requests, and audio is
# generated by audio.yml only for merged articles). The build therefore
# always contains: reviewed knowledge articles + their generated audio.
#
# This workflow intentionally does NOT build audio: it deploys whatever the
# audio workflow has already committed, so a failed TTS run never blocks or
# silently changes a site deployment.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro/Starlight site (knowledge + audio included)
        working-directory: site
        # .astro/ caches content-layer state from previous builds; clearing it
        # guarantees the fs audio checks in [category]/[slug].astro see the
        # artifacts committed by the audio workflow on this exact tree.
        run: |
          rm -rf .astro
          npm run build

      - name: Verify article pages were generated
        run: |
          MISSING=0
          while IFS= read -r -d '' md; do
            category_dir="$(basename "$(dirname "$md")")"
            slug="$(basename "$md" .md)"
            page="site/dist/${category_dir}/${slug}/index.html"
            if [ ! -f "$page" ]; then
              echo "::error::missing article page: $page (from $md)"
              MISSING=1
            fi
          done < <(find knowledge -name '*.md' -print0)
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "All knowledge articles have a built page."

      - name: Detect audio assets to verify
        id: audio
        run: |
          if compgen -G "site/public/audio/**/*.mp3" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No audio artifacts yet; deploying text-only knowledge base."
          fi

      - name: Verify audio files are exposed by the build
        if: steps.audio.outputs.present == 'true'
        run: |
          MISSING=0
          while IFS= read -r -d '' mp3; do
            rel="${mp3#site/public/}"
            if [ ! -f "site/dist/${rel}" ]; then
              echo "::error::audio file not copied into the build: $rel"
              MISSING=1
            fi
          done < <(find site/public/audio -name '*.mp3' -print0)
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "All audio artifacts are exposed by the site build."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
